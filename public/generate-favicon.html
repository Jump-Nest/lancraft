<!DOCTYPE html>
<html>
<head>
    <title>Generate Favicon</title>
</head>
<body>
    <h1>Favicon Generator</h1>
    <canvas id="canvas" width="32" height="32"></canvas>
    <br>
    <button onclick="downloadFavicon()">Download favicon.ico</button>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Black background
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 32, 32);
        
        // Draw golden crown
        ctx.fillStyle = '#FACC15';
        
        // Crown base
        ctx.fillRect(6, 22, 20, 3);
        
        // Crown body (simplified for 32x32)
        ctx.beginPath();
        ctx.moveTo(7, 12);
        ctx.lineTo(6, 22);
        ctx.lineTo(26, 22);
        ctx.lineTo(25, 12);
        ctx.lineTo(21, 16);
        ctx.lineTo(16, 9);
        ctx.lineTo(11, 16);
        ctx.closePath();
        ctx.fill();
        
        // Crown jewels
        ctx.beginPath();
        ctx.arc(7, 12, 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(16, 9, 2.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(25, 12, 2, 0, Math.PI * 2);
        ctx.fill();
        
        // Highlights
        ctx.fillStyle = '#FDE047';
        ctx.beginPath();
        ctx.arc(7, 12, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(16, 9, 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(25, 12, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        function downloadFavicon() {
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'favicon.png';
                a.click();
                URL.revokeObjectURL(url);
                alert('Downloaded as PNG. You can convert it to ICO using an online converter like https://convertio.co/png-ico/');
            });
        }
    </script>
</body>
</html>
