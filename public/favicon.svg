<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Black Background -->
  <rect width="128" height="128" fill="#000000"/>

  <!-- Golden Crown -->
  <g>
    <!-- Crown base band -->
    <rect x="24" y="88" width="80" height="12" fill="#FACC15" rx="2"/>

    <!-- Crown main body -->
    <path d="M 28 50 L 24 88 L 104 88 L 100 50 L 85 65 L 64 35 L 43 65 Z" fill="#FACC15"/>

    <!-- Crown highlights -->
    <path d="M 32 52 L 28 88 L 34 88 L 38 52 Z" fill="#FDE047" opacity="0.6"/>
    <path d="M 60 40 L 56 88 L 62 88 L 66 40 Z" fill="#FDE047" opacity="0.6"/>
    <path d="M 88 52 L 84 88 L 90 88 L 94 52 Z" fill="#FDE047" opacity="0.6"/>

    <!-- Crown jewels on peaks -->
    <circle cx="28" cy="50" r="6" fill="#FACC15"/>
    <circle cx="28" cy="50" r="4" fill="#FDE047"/>

    <circle cx="64" cy="35" r="8" fill="#FACC15"/>
    <circle cx="64" cy="35" r="6" fill="#FDE047"/>

    <circle cx="100" cy="50" r="6" fill="#FACC15"/>
    <circle cx="100" cy="50" r="4" fill="#FDE047"/>

    <!-- Decorative diamonds on crown body -->
    <path d="M 43 70 L 46 67 L 43 64 L 40 67 Z" fill="#FDE047"/>
    <path d="M 64 72 L 67 69 L 64 66 L 61 69 Z" fill="#FDE047"/>
    <path d="M 85 70 L 88 67 L 85 64 L 82 67 Z" fill="#FDE047"/>

    <!-- Shadow/depth -->
    <path d="M 24 88 L 28 50 L 30 50 L 26 88 Z" fill="#000000" opacity="0.2"/>
    <path d="M 104 88 L 100 50 L 98 50 L 102 88 Z" fill="#000000" opacity="0.2"/>
  </g>
</svg>

